services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: base44root
      MYSQL_DATABASE: jonatan777
      MYSQL_USER: jonatan
      MYSQL_PASSWORD: jonatanpass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pbase44root"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    ports:
      - "3000:80"
    environment:
      DB_HOST: db
      DB_USER: jonatan
      DB_PASS: jonatanpass
      DB_NAME: jonatan777
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "chmod 755 /var/www/html && exec apache2-foreground"

  setup:
    image: mysql:8.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./DATABASE:/docker-entrypoint-initdb.d:ro
    command: >
      bash -c "
      until mysqladmin ping -h db -u root -pbase44root --silent; do sleep 2; done;
      mysql -h db -u root -pbase44root jonatan777 < /docker-entrypoint-initdb.d/jonatan777.sql;
      echo 'SQL import complete';
      "
    restart: "no"

volumes:
  db_data:
